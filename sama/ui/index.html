<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Castle | القلعة</title>
    <style>
        :root { --gold: #d4af37; --neon: #a020f0; --bg: #080808; }
        body { background: var(--bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* سقف القلعة والأدوات */
        .castle-header { background: linear-gradient(to bottom, #1a1a1a, transparent); padding: 20px; display: flex; justify-content: space-around; border-bottom: 1px solid rgba(160, 32, 240, 0.3); }
        .nav-tool { background: rgba(160, 32, 240, 0.1); border: 1px solid var(--neon); color: white; padding: 10px 20px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .nav-tool:hover { background: var(--neon); box-shadow: 0 0 15px var(--neon); }

        /* ساحة القلعة (سما) */
        #main-hall { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #120520 0%, #000 100%); }
        .sama-presence { width: 220px; height: 220px; border: 3px solid var(--neon); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 40px rgba(160, 32, 240, 0.4); cursor: pointer; position: relative; }
        .sama-presence::before { content: ""; position: absolute; width: 100%; height: 100%; border: 1px dashed var(--neon); border-radius: 50%; animation: rotate 10s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* قاعة العمليات (الرسائل) */
        .operations-room { background: #0c0c0c; border-top: 3px solid var(--neon); padding: 30px; z-index: 100; box-shadow: 0 -20px 50px rgba(0,0,0,1); }
        #output-screen { color: var(--neon); text-align: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px var(--neon); min-height: 25px; }
        
        .command-wrap { display: flex; gap: 15px; max-width: 800px; margin: 0 auto; }
        input { flex: 1; background: #000; border: 2px solid #333; border-radius: 12px; padding: 15px 25px; color: white; outline: none; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--neon); box-shadow: 0 0 15px rgba(160, 32, 240, 0.2); }
        .execute-btn { background: var(--neon); color: white; border: none; padding: 0 40px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .execute-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
            #log { position:absolute; inset:10px 10px auto 10px; max-height:55%; overflow:auto; font-size:13px; }
        .ev { padding:4px 8px; margin:2px 0; border-radius:6px; background:rgba(255,255,255,.04); white-space:pre-wrap; }
        .ev.final { border-right:3px solid var(--gold); } .ev.blocked,.ev.error,.ev.denied { color:#ff6b6b; } .ev.ask { color:var(--gold); }
        .appr { background:#1a1205; border:1px solid var(--gold); border-radius:8px; padding:10px; margin-bottom:10px; }
        .appr button, #stopbtn { background:var(--neon); color:#fff; border:0; border-radius:6px; padding:6px 18px; cursor:pointer; }
        #stopbtn { background:#c0392b; display:none; position:absolute; bottom:10px; left:10px; }
    </style>
</head>
<body onclick="haptic()">

    <div class="castle-header">
        <button class="nav-tool" onclick="sys('🎥 فتح الكاميرا الملكية')">اتصال فيديو</button>
        <button class="nav-tool" onclick="sys('📲 عرض السكرين المباشر')">بث الشاشة</button>
        <button class="nav-tool" onclick="sys('💻 الدخول لغرفة الهكر')">غرفة العمليات</button>
    </div>

    <div id="main-hall">
        <div id="log"></div>
        <button id="stopbtn" onclick="stop()">⛔ إيقاف فوري</button>
        <div class="sama-presence" onclick="touch()" style="opacity:.35">
            <div style="text-align: center;">
                <div style="font-size: 10px; opacity: 0.6; letter-spacing: 2px;">SAMA SYSTEM</div>
                <div style="font-size: 16px; font-weight: bold; color: #fff;">القلعة نشطة</div>
            </div>
        </div>
    </div>

    <div class="operations-room">
        <div id="status" style="text-align:center;font-size:12px;opacity:.7"></div>
        <div id="approvals"></div>
        <div id="output-screen">بانتظار أوامرك يا سلطان.. القلعة تحت سيادتك.</div>
        <div class="command-wrap">
            <input type="text" id="cmd-input" placeholder="اكتبلي هنا.. عقلي اجتمع فيه كل ما تمنيت.">
            <button class="execute-btn" onclick="execute()">إرسال</button>
        </div>
    </div>

    <script>
const TOKEN = "__TOKEN__";
const api = (path, body) => fetch(path, body === undefined ? {headers:{"X-Token":TOKEN}} :
  {method:"POST", headers:{"X-Token":TOKEN,"Content-Type":"application/json"}, body:JSON.stringify(body)}).then(r=>r.json());
const out = document.getElementById('output-screen');
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function haptic() { if (navigator.vibrate) navigator.vibrate(10); }
function touch() { out.textContent = "سما: أنا هنا، اكتب المهمة."; }
function sys(t) { out.textContent = t + " — (قريباً)"; }

async function execute() {
  const i = document.getElementById('cmd-input'), v = i.value.trim();
  if (!v) return;
  i.value = '';
  const r = await api('/api/task', {text: v});
  if (!r.started) out.textContent = "سما: مشغولة بمهمة أخرى.";
}
document.getElementById('cmd-input').addEventListener('keydown', e => { if (e.key === 'Enter') execute(); });
const stop = () => api('/api/stop', {});
const answer = (id, ok) => api('/api/approve', {id, ok});

async function poll() {
  try {
    const s = await api('/api/state');
    document.getElementById('status').textContent =
      (s.llm ? "● النموذج المحلي جاهز: " + s.model : "○ شغّل Ollama") + " | الوضع: " + s.mode;
    const labels = {user:"أنت", thought:"فكرة", tool:"أداة", ask:"طلب إذن", denied:"مرفوض", blocked:"ممنوع", error:"خطأ", final:"سما"};
    document.getElementById('log').innerHTML = s.events.map(e =>
      `<div class="ev ${e.kind}"><b>${labels[e.kind]||e.kind}</b> ${esc(e.text)}</div>`).join('');
    document.getElementById('log').scrollTop = 1e9;
    document.getElementById('approvals').innerHTML = s.pending.map(p =>
      `<div class="appr">⚠ ${esc(p.tool)} ${esc(JSON.stringify(p.args))}<br><small>${esc(p.reason)}</small><br>
       <button onclick="answer('${p.id}',true)">موافق</button> <button onclick="answer('${p.id}',false)">رفض</button></div>`).join('');
    document.getElementById('stopbtn').style.display = s.busy ? 'inline-block' : 'none';
  } catch (e) {}
}
setInterval(poll, 700);
</script>
</body>
</html>
