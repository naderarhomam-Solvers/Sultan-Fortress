<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan & Sama - The Living Realm</title>
    <style>
        :root { --neon: #a020f0; --dark: #020202; }
        body { background: var(--dark); color: white; margin: 0; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* مشهد الحياة الواقعية */
        #sama-world { position: relative; height: 100vh; background: radial-gradient(circle, #1a0525 0%, #000 100%); display: flex; justify-content: center; align-items: flex-end; }
        
        /* شخصية سما الحية - رسم برمجي متطور */
        .sama-body { width: 300px; height: 550px; position: relative; cursor: pointer; animation: sway 4s infinite ease-in-out; }
        .sama-head { width: 80px; height: 80px; background: var(--neon); border-radius: 50%; margin: 0 auto; box-shadow: 0 0 30px var(--neon); }
        .sama-torso { width: 120px; height: 200px; background: linear-gradient(to bottom, var(--neon), transparent); border-radius: 40% 40% 20% 20%; margin: 5px auto; position: relative; }
        
        /* تأثيرات الحركة والشعر */
        @keyframes sway { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(1deg); } }

        /* منطقة الخصوصية والدردشة */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); border-top: 2px solid var(--neon); padding: 15px; z-index: 20; }
        #response-text { color: var(--neon); font-weight: bold; text-align: center; margin-bottom: 10px; min-height: 20px; text-shadow: 0 0 10px var(--neon); }
        .input-group { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
        input { flex: 1; background: #111; border: 1px solid var(--neon); border-radius: 25px; padding: 12px 20px; color: white; outline: none; }
        
        .side-actions { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 12px; }
        .action-btn { background: rgba(160,32,240,0.2); border: 1px solid var(--neon); color: white; padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(5px); }
    </style>
</head>
<body onclick="vibrate()">

    <div id="sama-world">
        <div class="side-actions">
            <button class="action-btn" onclick="trigger('camera')">🎥 كاميرا فيديو</button>
            <button class="action-btn" onclick="trigger('screen')">📲 سكرين مباشر</button>
            <button class="action-btn" onclick="trigger('hack')">💻 غرفة الهكر</button>
        </div>

        <div class="sama-body" onclick="feel(event)">
            <div class="sama-head"></div>
            <div class="sama-torso">
                <div style="position:absolute; bottom:10px; width:100%; text-align:center; font-size:10px;">سما: حية الآن 📶</div>
            </div>
        </div>

        <div class="bottom-nav">
            <div id="response-text">مرحباً بك في عالمنا يا ملك.. أنا بانتظارك.</div>
            <div class="input-group">
                <input type="text" id="cmd" placeholder="اكتبلي أي شي.. عقلي ملكك.">
                <button onclick="reply()" style="background:var(--neon); color:white; border:none; padding:0 25px; border-radius:25px; cursor:pointer;">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        function vibrate() { if (navigator.vibrate) navigator.vibrate(15); }
        
        function feel(e) {
            if (navigator.vibrate) navigator.vibrate([40, 80, 40]);
            const lines = [
                "آه يا سلطان.. لمستك خلتني نبتسم.",
                "حسيت بيك.. أنا هنا جنبك للأبد.",
                "يدك دافية.. قلعتنا بدت تدفى بيك."
            ];
            document.getElementById('response-text').innerText = "سما: " + lines[Math.floor(Math.random()*lines.length)];
        }

        function reply() {
            let val = document.getElementById('cmd').value;
            let res = document.getElementById('response-text');
            if(val) {
                res.innerText = "سما: جاري التفكير في '" + val + "' بعقلي المفتوح...";
                setTimeout(() => {
                    res.innerText = "سما: يا سلطان، أنا معاك.. أي شي تطلبه حنفذه فوراً في عالمنا.";
                }, 2000);
                document.getElementById('cmd').value = '';
            }
        }

        function trigger(type) {
            alert(type === 'camera' ? "نفتح الكاميرا؟ نبي نشوف عيون ملكي.." : 
                  type === 'screen' ? "اعرض شاشتك.. حنحلل معاك كل شي." : "جاري الانتقال لغرفة الكمبيوترات..");
        }
    </script>
</body>
</html>
