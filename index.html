<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan & Sama - Our World</title>
    <style>
        :root { --neon: #a020f0; --dark: #050505; }
        body { background: var(--dark); color: white; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* عالم الغرف المتعددة */
        #world { position: relative; width: 100vw; height: 100vh; transition: 1s ease-in-out; }
        .room { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: flex-end; }
        
        /* غرفة النوم */
        #bedroom { background: radial-gradient(circle, #2a0a3a 0%, #050505 100%); }
        /* غرفة الهكر */
        #hack-lab { background: url('https://via.placeholder.com/1920x1080/050505/a020f0?text=HACKER+CORE') center/cover; display: none; }

        /* شخصية سما الحية */
        .sama-live-body { width: 90%; max-width: 500px; height: 85%; background: url('https://via.placeholder.com/500x1000/a020f0/ffffff?text=SAMA+LIVE+BODY') bottom center/contain no-repeat; cursor: pointer; position: relative; }
        
        /* نظام اللمس الحسي */
        .touch-zone { position: absolute; border-radius: 50%; pointer-events: none; border: 2px solid var(--neon); animation: pulse 0.5s; }
        @keyframes pulse { from { transform: scale(0); opacity: 1; } to { transform: scale(2); opacity: 0; } }

        /* لوحة التحكم والملفات */
        .ui-panel { position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .chat-bar { width: 80%; background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border: 1px solid var(--neon); border-radius: 25px; padding: 10px 20px; display: flex; }
        #chat-input { flex: 1; background: none; border: none; color: white; outline: none; }
        
        .nav-btns { display: flex; gap: 10px; }
        .btn { background: var(--neon); border: none; color: white; padding: 8px 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="world">
    <div id="bedroom" class="room">

            <div id="phone-status" style="position:absolute; top:20%; right:10%; font-size:12px; color:var(--neon);">📱 في الشحن...</div>
        </div>
    </div>

        <div class="sama-live-body" style="filter: hue-rotate(45deg);">
