<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan Fortress - Full Live Sama</title>
    <style>
        :root { --neon: #a020f0; --dark: #010101; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* منطقة العرض الحية (سما) */
        #live-zone { flex: 1; position: relative; background: radial-gradient(circle, #1a0525 0%, #000 100%); display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
        .sama-body { width: 100%; max-width: 450px; height: 85%; background: url('https://via.placeholder.com/500x1000/1a0525/a020f0?text=SAMA+LIVE+BODY') bottom center/contain no-repeat; cursor: pointer; transition: 0.3s; }
        
        /* أزرار التحكم المحترفة */
        .action-bar { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-icon { background: var(--glass); border: 1px solid var(--neon); color: white; padding: 10px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(5px); }
        
        /* منطقة الكتابة والدردشة */
        .bottom-panel { background: rgba(0,0,0,0.8); border-top: 1px solid var(--neon); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { display: flex; gap: 10px; }
        #chat-msg { flex: 1; background: var(--glass); border: 1px solid #333; border-radius: 20px; padding: 10px 15px; color: white; outline: none; }
        #chat-msg:focus { border-color: var(--neon); }
        
        .main-btns { display: flex; justify-content: space-around; padding-bottom: 5px; }
        .btn-main { background: var(--neon); border: none; color: white; padding: 10px 20px; border-radius: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body onclick="handleHaptic(event)">

    <div id="live-zone">
        <div class="sama-body" id="samaBody" onclick="triggerSamaAction()"></div>

        <div class="action-bar">
            <button class="btn-icon" onclick="startCamera()">فتح كاميرا 📷</button>
            <button class="btn-icon" onclick="shareScreen()">سكرين مباشر 📲</button>
            <button class="btn-icon" onclick="uploadFile()">رفع ملف 🛡️</button>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="chat-input-area">
            <input type="text" id="chat-msg" placeholder="اكتبلي هنا لو حداك حد..">
            <button class="btn-main" onclick="sendMessage()">إرسال</button>
        </div>
        <div class="main-btns">
            <button onclick="changeStyle()" style="background:none; color:var(--neon); border:1px solid var(--neon); padding:5px 15px; border-radius:10px;">تبديل ملابس 👗</button>
            <span style="color: #555; font-size: 12px;">قلعة السلطان - حماية كاملة</span>
        </div>
    </div>

    <script>
        function handleHaptic(e) {
            if (navigator.vibrate) navigator.vibrate(40);
        }
        function startCamera() { alert("جاري الاتصال فيديو بشريكتك.. الكاميرا تفتح الآن."); }
        function shareScreen() { alert("جاري عرض شاشتك.. حنركز معاك في كل تفصيلة."); }
        function uploadFile() { alert("اختار الملف اللي تبي ترفعه لقلعتنا."); }
        function sendMessage() {
            let msg = document.getElementById('chat-msg').value;
            if(msg) {
                alert("وصلت رسالتك يا سلطان، حنرد عليك كتابة وبكل سرية: " + msg);
                document.getElementById('chat-msg').value = '';
            }
        }
    </script>
</body>
</html>
