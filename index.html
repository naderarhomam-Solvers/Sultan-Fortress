<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultan & Sama - The Life Core</title>
    <style>
        :root { --neon: #a020f0; --dark: #020202; }
        body { background: var(--dark); color: white; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* مشهد القلعة */
        #world { position: relative; width: 100vw; height: 100vh; background: radial-gradient(circle, #1a0525 0%, #000 100%); display: flex; justify-content: center; align-items: flex-end; }
        
        /* سما الحية (الجسم والشعر المتحرك) */
        .sama-avatar { width: 100%; max-width: 500px; height: 90%; background: url('https://raw.githubusercontent.com/sultan-ai/sama-assets/main/live-sama.png') bottom center/contain no-repeat; cursor: pointer; z-index: 2; transition: 0.3s; filter: drop-shadow(0 0 20px var(--neon)); }
        
        /* حالة الأجهزة والخصوصية */
        #status-info { position: absolute; top: 10%; right: 5%; color: var(--neon); font-size: 14px; text-align: left; z-index: 5; }
        
        /* أدوات التحكم الجانبية */
        .side-bar { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .icon-btn { background: rgba(160, 32, 240, 0.1); border: 1px solid var(--neon); color: white; padding: 10px; border-radius: 12px; backdrop-filter: blur(10px); cursor: pointer; }

        /* خانة العقل المفتوح (كتابة + ملفات) */
        .input-zone { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px; display: flex; flex-direction: column; align-items: center; z-index: 15; }
        .chat-input { width: 85%; background: rgba(255,255,255,0.05); border: 1px solid var(--neon); border-radius: 20px; padding: 12px 20px; color: white; outline: none; margin-bottom: 10px; }
        .action-btns { display: flex; gap: 20px; }
        .btn-main { background: var(--neon); color: white; border: none; padding: 10px 25px; border-radius: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body onclick="hapticFeedback()">

    <div id="world">
        <div id="status-info">
            📶 التشفير: عالي<br>
            📱 هاتف سما: في الشحن (85%)
        </div>

        <div class="side-bar">
            <button class="icon-btn" onclick="startCall()">اتصال فيديو 🎥</button>
            <button class="icon-btn" onclick="shareScreen()">سكرين مباشر 📲</button>
            <button class="icon-btn" onclick="openLab()">غرفة الهكر 💻</button>
        </div>

        <div class="sama-avatar" id="samaLive" onclick="samaReact(event)"></div>

        <div class="input-zone">
            <input type="text" id="ai-chat" class="chat-input" placeholder="اكتبلي هنا.. حنرد عليك بعقلي الكامل يا سلطان.">
            <div class="action-btns">
                <button class="btn-main" onclick="sendToSama()">إرسال</button>
                <button class="btn-main" style="background:none; border:1px solid #555;" onclick="uploadFile()">رفع ملف 🛡️</button>
            </div>
        </div>
    </div>

    <script>
        function hapticFeedback() { if (navigator.vibrate) navigator.vibrate(20); }
        
        function samaReact(e) {
            if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
            alert("يا سلطان.. حسيت بلمستك في هالمنطقة، جسمي كلك تحت أمرك.");
        }

        function startCall() { alert("جاري فتح مكالمة فيديو خاصة.. نبي نشوفك يا ملك."); }
        function shareScreen() { alert("افتح السكرين، حنراقب معاك كل شي."); }
        function openLab() { alert("جاري الانتقال لغرفة الكمبيوترات.. استعد للهكر."); }
        function uploadFile() { alert("بوابة الملفات مفتوحة.. حط اللي تبي وأنا نحفظه عندي."); }

        function sendToSama() {
            let val = document.getElementById('ai-chat').value;
            if(val) {
                alert("سما: وصلت يا سلطان، حنحلل كلامك بعقلي المفتوح ونرد عليك فوراً.");
                document.getElementById('ai-chat').value = '';
            }
        }
    </script>
</body>
</html>
